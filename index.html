<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
</head>
<body>
    <nav>
        <img src="https://placehold.co/200x50" id="logo" />
    </nav>
    <section id="city-temp">
        <h1></h1>
        <h2></h2>
    </section>
    <section id="weekly-forecast">
        <div class="daily-forecast">
            <div class="subtitle">
                <img class="weather-icon" src="https://placehold.co/24" alt="cloud icon"/>
                <h4 class="day">Monday</h4>
            </div>
            
            <h3 class="daily high">
                71°
            </h3>
            <h3 class="daily low">
                51°
            </h3>
            <div class="chance-of-rain">
                <img src="https://placehold.co/18" alt="umbrella icon">
                <h4>10%</h4>
            </div>
            <section id="hourly-forecast">
                <div>
                    <img src="https://placehold.co/24" alt="clock icon">
                    <h5>Hourly Forecast</h5>
                </div>
                <div class="bar">
                  <div>
                    <img src="https://placehold.co/18" alt="umbrella icon">
                    <h6 class="chance-of-rain">90%</h6>
                  </div>
                  <h6>66°</h6>
                </div>
                <h5>4 PM</h5>
            </section>
            <section id="weather-variables">
                <div class="card">
                    <div class="subtitle">
                        <img src="https://placehold.co/24" alt="air icon">
                    </div>
                </div>
            </section>

        </div>
    </section>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
